services:
  postgres:
    image: postgres:18
    container_name: gradescan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gradescan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gradescan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
